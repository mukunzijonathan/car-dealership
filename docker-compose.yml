# Local extras for the final project. PostgreSQL stays in pgAdmin on the host.
services:
  mongo:
    image: mongo:7
    container_name: cdms-mongo
    ports:
      - "27017:27017"
    volumes:
      - cdms_mongo:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cdms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  cdms_mongo:
