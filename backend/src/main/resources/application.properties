spring.application.name=cardealership
server.port=8080

# PostgreSQL — operational data (cars, customers, staff, sales, users)
spring.datasource.url=jdbc:postgresql://localhost:5432/carDealership
spring.datasource.username=postgres
spring.datasource.password=mukunzi111
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# MongoDB — documents and operation logs (start with: docker compose up -d)
spring.data.mongodb.uri=mongodb://localhost:27017/cdms_docs

# RabbitMQ — email / SMS / sale events
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT for the React UI and Postman
cdms.jwt.secret=cdms-local-dev-secret-change-me-please-32b
cdms.jwt.expiration-ms=86400000
cdms.frontend-url=http://localhost:5173

# OAuth2 (Google). Replace these to enable "Continue with Google".
# Create credentials at https://console.cloud.google.com/ — redirect URI:
# http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
